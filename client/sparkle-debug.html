<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sparkle Curve Debug</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f5f3fa; color: #262333; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px; background: radial-gradient(ellipse at 50% 0%, #e7e1f5, transparent 55%), #f5f3fa; }
      header { max-width: 1200px; margin: 0 auto 22px; }
      h1 { margin: 0 0 6px; font-size: clamp(24px, 4vw, 36px); letter-spacing: -.04em; }
      header p { margin: 0; color: #716c7c; font-size: 14px; }
      .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 14px; color: #615b6d; font-size: 12px; }
      .legend span { display: inline-flex; align-items: center; gap: 7px; }
      .key { width: 9px; height: 9px; border-radius: 50%; background: #ff506e; }
      .key.control { background: #e5a900; }
      .key.center { background: #1e9b69; }
      .grid { display: grid; max-width: 1200px; margin: auto; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
      .sample { overflow: hidden; border: 1px solid rgba(91, 77, 134, .17); border-radius: 14px; background: rgba(255,255,255,.72); box-shadow: 0 12px 35px rgba(56, 43, 85, .07); }
      .sample h2 { margin: 0; padding: 12px 15px 0; font-size: 14px; font-weight: 700; }
      .sample h2 small { margin-left: 6px; color: #898293; font-weight: 500; }
      .sample svg { display: block; width: 100%; height: 220px; }
      .sample .guides { fill: none; stroke: #9890a7; stroke-width: 1; stroke-dasharray: 3 4; opacity: .55; }
      .sparkle-shape { fill: #0b0bc8; }
      .tip-point { fill: #ff506e; stroke: white; stroke-width: 2; }
      .control-point { fill: #e5a900; stroke: white; stroke-width: 1.5; }
      .center-point { fill: #1e9b69; stroke: white; stroke-width: 1.5; }
      .hint { max-width: 1200px; margin: 16px auto 0; color: #716c7c; font-size: 12px; }
      @media (max-width: 760px) { body { padding: 20px 12px; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; } .sample svg { height: 180px; } }
      @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } .sample svg { height: 210px; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Sparkle curve debug</h1>
      <p>Compare the same four-arm star with cubic Bézier control points pinched toward its center.</p>
      <div class="legend"><span><i class="key"></i> Tips</span><span><i class="key control"></i> Cubic control points</span><span><i class="key center"></i> Center</span></div>
    </header>
    <main class="grid" id="samples" aria-label="Nine sparkle pinch samples"></main>
    <p class="hint">The fourth arm is about 64% as long as the longest arm. Lower pinch values draw sharper, thinner arms.</p>
    <script type="module">
      import { referenceTips, sparkleGeometry } from './src/sparkle.mjs';

      const values = [0.03, 0.045, 0.06, 0.075, 0.09, 0.105, 0.12, 0.135, 0.15];
      const center = [180, 142];
      const root = document.querySelector('#samples');

      for (const pinch of values) {
        const geometry = sparkleGeometry(referenceTips, pinch, ...center);
        const sample = document.createElement('section');
        sample.className = 'sample';
        sample.innerHTML = `
          <h2>Pinch <small>${pinch.toFixed(3)}</small></h2>
          <svg viewBox="0 0 360 220" role="img" aria-label="Four-point sparkle, pinch ${pinch.toFixed(3)}">
            <path class="guides" d="M ${center[0]} ${center[1]} L ${geometry.tips.map((point) => point.join(' ')).join(' M ' + center[0] + ' ' + center[1] + ' L ')}" />
            <path class="sparkle-shape" d="${geometry.d}" />
            ${geometry.controls.map(([x, y]) => `<circle class="control-point" cx="${x}" cy="${y}" r="4" />`).join('')}
            ${geometry.tips.map(([x, y]) => `<circle class="tip-point" cx="${x}" cy="${y}" r="5" />`).join('')}
            <circle class="center-point" cx="${center[0]}" cy="${center[1]}" r="4" />
          </svg>`;
        root.append(sample);
      }
    </script>
  </body>
</html>
